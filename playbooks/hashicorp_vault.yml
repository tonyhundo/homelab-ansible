---
- name: Install HashiCorp Vault
  hosts: all
  become: true

  vars:
    vault_node_id: "vault-01"
    vault_data_dir: /opt/vault/data
    vault_api_addr: "https://vault.example.com:8200"
    vault_cluster_addr: "https://vault.example.com:8201"
    cert_dir: /etc/ssl/example

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add HashiCorp apt repository
      ansible.builtin.deb822_repository:
        name: hashicorp
        types: deb
        uris: https://apt.releases.hashicorp.com
        suites: "{{ ansible_distribution_release }}"
        components: main
        signed_by: https://apt.releases.hashicorp.com/gpg
        state: present

    - name: Install Vault
      ansible.builtin.apt:
        name: vault
        state: present
        update_cache: true

    - name: Create Vault raft data directory
      ansible.builtin.file:
        path: "{{ vault_data_dir }}"
        state: directory
        owner: vault
        group: vault
        mode: '0750'

    - name: Ensure ssl-cert group exists
      ansible.builtin.group:
        name: ssl-cert
        state: present

    - name: Grant vault user access to TLS materials
      ansible.builtin.user:
        name: vault
        groups: ssl-cert
        append: true
      notify: Restart vault

    - name: Write Vault server config
      ansible.builtin.copy:
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: '0640'
        content: |
          ui = true
          # Unprivileged LXC cannot grant CAP_IPC_LOCK; compensate by disabling mlock.
          disable_mlock = true

          storage "raft" {
            path    = "{{ vault_data_dir }}"
            node_id = "{{ vault_node_id }}"
          }

          listener "tcp" {
            address         = "0.0.0.0:8200"
            cluster_address = "0.0.0.0:8201"
            tls_cert_file   = "{{ cert_dir }}/cert.pem"
            tls_key_file    = "{{ cert_dir }}/key.pem"
            tls_min_version = "tls12"

            telemetry {
              unauthenticated_metrics_access = true
            }
          }

          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname          = true
          }

          api_addr     = "{{ vault_api_addr }}"
          cluster_addr = "{{ vault_cluster_addr }}"
      notify: Restart vault

    - name: Ensure systemd drop-in dir for vault.service
      ansible.builtin.file:
        path: /etc/systemd/system/vault.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Drop CAP_IPC_LOCK requirement for LXC
      ansible.builtin.copy:
        dest: /etc/systemd/system/vault.service.d/lxc.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          CapabilityBoundingSet=
          AmbientCapabilities=
      notify: Restart vault

    - name: Enable and start Vault
      ansible.builtin.systemd:
        name: vault
        enabled: true
        state: started
        daemon_reload: true

    - name: Set VAULT_ADDR globally in /etc/environment
      ansible.builtin.lineinfile:
        path: /etc/environment
        regexp: '^VAULT_ADDR='
        line: 'VAULT_ADDR="https://vault.example.com:8200"'
        owner: root
        group: root
        mode: '0644'
        create: true

    - name: Set VAULT_CACERT globally in /etc/environment
      ansible.builtin.lineinfile:
        path: /etc/environment
        regexp: '^VAULT_CACERT='
        line: 'VAULT_CACERT="{{ cert_dir }}/ca.pem"'
        owner: root
        group: root
        mode: '0644'
        create: true

    - name: Check Vault init/seal status
      ansible.builtin.command:
        cmd: vault status -format=json
      environment:
        VAULT_ADDR: "{{ vault_api_addr }}"
        VAULT_CACERT: "{{ cert_dir }}/ca.pem"
      register: vault_status
      changed_when: false
      failed_when: false

    - name: Report post-install state
      ansible.builtin.debug:
        msg: >-
          vault status rc={{ vault_status.rc }}.
          rc=2 means running but uninitialised — follow RUNBOOK_vault.md.
          rc=0 means running and unsealed. rc=1 means error — check `systemctl status vault`.

  handlers:
    - name: Restart vault
      ansible.builtin.systemd:
        name: vault
        state: restarted
        daemon_reload: true
