---
- name: Install Grafana
  hosts: all
  become: true

  tasks:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - wget
        state: present

    - name: Add Grafana apt repository (deb822 format)
      ansible.builtin.deb822_repository:
        name: grafana
        types: deb
        uris: https://apt.grafana.com
        suites: stable
        components: main
        signed_by: https://apt.grafana.com/gpg.key
        state: present

    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present
        update_cache: true

    - name: Configure Grafana datasource for Prometheus
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        owner: root
        group: grafana
        mode: '0640'
        content: |
          apiVersion: 1
          datasources:
            - name: prometheus
              type: prometheus
              uid: ds_prometheus
              access: proxy
              url: https://prometheus.example.com:9090
              jsonData:
                tlsSkipVerify: true
              isDefault: true
              editable: false
      notify: Restart grafana

    - name: Configure Grafana dashboard provider
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/dashboards/dashboards.yml
        owner: root
        group: grafana
        mode: '0640'
        content: |
          apiVersion: 1
          providers:
            - name: 'default'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              updateIntervalSeconds: 30
              options:
                path: /var/lib/grafana/dashboards
                foldersFromFilesStructure: false
      notify: Restart grafana

    - name: Create dashboards directory
      ansible.builtin.file:
        path: /var/lib/grafana/dashboards
        state: directory
        owner: grafana
        group: grafana
        mode: '0755'

    - name: Deploy network dashboard
      ansible.builtin.copy:
        src: files/grafana-network-dashboard.json
        dest: /var/lib/grafana/dashboards/network-overview.json
        owner: grafana
        group: grafana
        mode: '0644'
      notify: Restart grafana

    - name: Deploy claude-code dashboard
      ansible.builtin.copy:
        src: files/grafana-claude-code-dashboard.json
        dest: /var/lib/grafana/dashboards/claude-code-usage.json
        owner: grafana
        group: grafana
        mode: '0644'
      notify: Restart grafana

    - name: Deploy homelab overview dashboard
      ansible.builtin.copy:
        src: files/grafana-homelab-overview-dashboard.json
        dest: /var/lib/grafana/dashboards/homelab-overview.json
        owner: grafana
        group: grafana
        mode: '0644'
      notify: Restart grafana

    - name: Add grafana user to ssl-cert group
      ansible.builtin.user:
        name: grafana
        groups: ssl-cert
        append: true
      notify: Restart grafana

    - name: Configure Grafana TLS
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: server
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: '0640'
        owner: root
        group: grafana
      loop:
        - { option: protocol, value: https }
        - { option: cert_file, value: /etc/ssl/example/cert.pem }
        - { option: cert_key, value: /etc/ssl/example/key.pem }
      notify: Restart grafana

    - name: Enable and start grafana
      ansible.builtin.systemd:
        name: grafana-server
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart grafana
      ansible.builtin.systemd:
        name: grafana-server
        state: restarted
