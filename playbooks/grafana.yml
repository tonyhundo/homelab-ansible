---
- name: Install Grafana
  hosts: all
  become: true

  tasks:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - wget
        state: present

    - name: Add Grafana apt repository (deb822 format)
      ansible.builtin.deb822_repository:
        name: grafana
        types: deb
        uris: https://apt.grafana.com
        suites: stable
        components: main
        signed_by: https://apt.grafana.com/gpg.key
        state: present

    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present
        update_cache: true

    - name: Configure Grafana datasource for Prometheus
      copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        owner: root
        group: grafana
        mode: '0640'
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus.example.com:9090
              isDefault: true
              editable: false
      notify: Restart grafana

    - name: Enable and start grafana
      systemd:
        name: grafana-server
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart grafana
      systemd:
        name: grafana-server
        state: restarted
