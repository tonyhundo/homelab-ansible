---
- name: Configure Splunk syslog input
  hosts: splunk
  become: true
  vars:
    splunk_home: /opt/splunk

  tasks:
    - name: Add syslog TCP input to Splunk
      ansible.builtin.blockinfile:
        path: "{{ splunk_home }}/etc/system/local/inputs.conf"
        block: |

          [tcp://1514]
          disabled = false
          sourcetype = syslog
          index = main
        marker: "# {mark} ANSIBLE MANAGED - SYSLOG INPUT"
        owner: splunk
        group: splunk
        mode: '0600'
      notify: Restart splunk

  handlers:
    - name: Restart splunk
      ansible.builtin.systemd:
        name: splunk
        state: restarted

- name: Configure rsyslog forwarding to Splunk
  hosts: fiordland
  become: true

  tasks:
    - name: Configure rsyslog to forward to Splunk
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/50-splunk.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Forward all logs to Splunk via TCP
          *.* @@192.0.2.102:1514
      notify: Restart rsyslog

  handlers:
    - name: Restart rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted
