---
# Configure the Proxmox VE node to track the public no-subscription repo
# instead of the enterprise (subscription-only) repo, so `apt dist-upgrade`
# delivers point releases (e.g. 9.1 -> 9.2). Run dist-upgrade via patch.yml.
- name: Configure Proxmox VE apt repositories (no-subscription)
  hosts: proxmox
  become: true

  tasks:
    - name: Add pve-no-subscription repository
      ansible.builtin.deb822_repository:
        name: pve-no-subscription
        types: deb
        uris: http://download.proxmox.com/debian/pve
        suites: trixie
        components: pve-no-subscription
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        state: present

    - name: Disable enterprise PVE repository (no subscription)
      ansible.builtin.deb822_repository:
        name: pve-enterprise
        types: deb
        uris: https://enterprise.proxmox.com/debian/pve
        suites: trixie
        components: pve-enterprise
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        enabled: false
        state: present

    - name: Disable enterprise Ceph repository (no subscription)
      ansible.builtin.deb822_repository:
        name: ceph
        types: deb
        uris: https://enterprise.proxmox.com/debian/ceph-squid
        suites: trixie
        components: enterprise
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        enabled: false
        state: present
