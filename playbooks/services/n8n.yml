---
- name: Install n8n
  hosts: all
  become: true

  tasks:
    - name: Install Node.js prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - jq
        state: present
        update_cache: true

    - name: Add NodeSource apt repository
      ansible.builtin.deb822_repository:
        name: nodesource
        types: deb
        uris: https://deb.nodesource.com/node_22.x
        suites: nodistro
        components: main
        signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        state: present

    # state: latest so a NodeSource major bump (e.g. node_20.x -> node_22.x)
    # actually upgrades an already-installed nodejs; state: present would
    # leave the old major in place.
    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: latest  # noqa: package-latest
        update_cache: true

    # state: latest so the playbook tracks the newest n8n (rebuilding native
    # modules such as isolated-vm against the installed Node major). n8n 2.x
    # requires Node 22+, hence the node_22.x repo above.
    - name: Install n8n globally
      community.general.npm:
        name: n8n
        global: true
        state: latest

    - name: Create n8n system user
      ansible.builtin.user:
        name: n8n
        system: true
        shell: /usr/sbin/nologin
        create_home: true
        home: /var/lib/n8n

    - name: Create n8n data directory
      ansible.builtin.file:
        path: /var/lib/n8n/.n8n
        state: directory
        owner: n8n
        group: n8n
        mode: '0750'

    - name: Add n8n user to ssl-cert group
      ansible.builtin.user:
        name: n8n
        groups: ssl-cert
        append: true
      notify: Restart n8n

    - name: Create n8n systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/n8n.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=n8n - Workflow Automation
          After=network.target

          [Service]
          User=n8n
          Group=n8n
          Type=simple
          WorkingDirectory=/var/lib/n8n
          Environment=N8N_HOST=0.0.0.0
          Environment=N8N_PORT=5678
          Environment=N8N_PROTOCOL=https
          Environment=N8N_SSL_CERT=/etc/ssl/example/cert.pem
          Environment=N8N_SSL_KEY=/etc/ssl/example/key.pem
          Environment=GENERIC_TIMEZONE=America/New_York
          Environment=N8N_USER_FOLDER=/var/lib/n8n
          ExecStart=/usr/bin/n8n start
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart n8n

    - name: Enable and start n8n
      ansible.builtin.systemd:
        name: n8n
        enabled: true
        state: started
        daemon_reload: true

    - name: Install docmost_import.sh helper
      ansible.builtin.copy:
        src: files/docmost_import.sh
        dest: /usr/local/bin/docmost_import.sh
        owner: root
        group: root
        mode: '0755'

    - name: Ensure /etc/default/docmost-import exists with placeholder credentials
      ansible.builtin.copy:
        dest: /etc/default/docmost-import
        owner: root
        group: n8n
        mode: '0640'
        force: false
        content: |
          # Credentials for /usr/local/bin/docmost_import.sh
          # Edit this file on the n8n host and set real values.
          DOCMOST_EMAIL=CHANGEME
          DOCMOST_PASSWORD=CHANGEME

  handlers:
    - name: Restart n8n
      ansible.builtin.systemd:
        name: n8n
        state: restarted
