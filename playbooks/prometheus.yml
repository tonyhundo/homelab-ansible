---
- name: Install Prometheus
  hosts: prometheus
  become: true
  vars:
    prometheus_version: "3.12.0"

  tasks:
    - name: Create prometheus system user
      ansible.builtin.user:
        name: prometheus
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create prometheus directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Download prometheus
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
        mode: '0644'

    - name: Extract prometheus
      ansible.builtin.unarchive:
        src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
        dest: /tmp/
        remote_src: true

    - name: Install prometheus and promtool binaries
      ansible.builtin.copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        owner: root
        group: root
        mode: '0755'
        remote_src: true
      loop:
        - prometheus
        - promtool

    # Prometheus 3.x no longer bundles consoles/console_libraries in the
    # release tarball, and the --web.console.* flags below were removed with
    # them. (See https://prometheus.io/docs/prometheus/3.4/migration/)
    - name: Configure prometheus
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0640'
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']
                  labels:
                    instance: 'prometheus'

            - job_name: 'node'
              static_configs:
          {% for host in groups['all'] %}
                - targets:
                    - '{{ hostvars[host]["ansible_host"] | default(host) }}:9100'
                  labels:
                    instance: '{{ host.split(".")[0] }}'
          {% endfor %}

            - job_name: 'pihole'
              static_configs:
          {% for host in groups['pihole'] %}
                - targets:
                    - '{{ hostvars[host]["ansible_host"] | default(host) }}:9617'
                  labels:
                    instance: '{{ host.split(".")[0] }}'
          {% endfor %}

            - job_name: 'gitea'
              scheme: https
              tls_config:
                insecure_skip_verify: true
              static_configs:
          {% for host in groups['gitea'] %}
                - targets:
                    - '{{ hostvars[host]["ansible_host"] | default(host) }}:3000'
                  labels:
                    instance: '{{ host.split(".")[0] }}'
          {% endfor %}

            - job_name: 'mariadb'
              static_configs:
          {% for host in groups['mariadb'] %}
                - targets:
                    - '{{ hostvars[host]["ansible_host"] | default(host) }}:9104'
                  labels:
                    instance: '{{ host.split(".")[0] }}'
          {% endfor %}

            - job_name: 'plex'
              static_configs:
                - targets:
                    - 'fiordland.example.com:9594'
                  labels:
                    instance: 'fiordland'

            - job_name: 'jellyfin'
              static_configs:
                - targets:
                    - 'emperor.example.com:9594'
                  labels:
                    instance: 'emperor'

            - job_name: 'snmp'
              scrape_interval: 30s
              scrape_timeout: 20s
              metrics_path: /snmp
              params:
                auth: ['unifi_v3']
                module: ['if_mib']
              static_configs:
                - targets:
                    - '198.51.100.1'
                    - '198.51.100.2'
                    - '198.51.100.3'
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - source_labels: [__param_target]
                  target_label: instance
                - target_label: __address__
                  replacement: fiordland.example.com:9116

            - job_name: 'pve'
              metrics_path: /pve
              params:
                target: ['192.0.2.5']
                cluster: ['1']
                node: ['1']
              static_configs:
                - targets:
                    - 'localhost:9221'
              relabel_configs:
                - source_labels: [__param_target]
                  target_label: instance
                  replacement: 'chinstrap'

            - job_name: 'claude_code'
              static_configs:
                - targets:
                    - 'emperor.example.com:8889'
                  labels:
                    instance: 'emperor'

            - job_name: 'vault'
              scheme: https
              tls_config:
                insecure_skip_verify: true
              metrics_path: /v1/sys/metrics
              params:
                format: ['prometheus']
              static_configs:
                - targets:
                    - 'vault.example.com:8200'
                  labels:
                    instance: 'vault'
      notify: Restart prometheus

    - name: Add prometheus user to ssl-cert group
      ansible.builtin.user:
        name: prometheus
        groups: ssl-cert
        append: true
      notify: Restart prometheus

    - name: Create prometheus web config for TLS
      ansible.builtin.copy:
        dest: /etc/prometheus/web.yml
        owner: prometheus
        group: prometheus
        mode: '0640'
        content: |
          tls_server_config:
            cert_file: /etc/ssl/example/cert.pem
            key_file: /etc/ssl/example/key.pem
      notify: Restart prometheus

    - name: Create prometheus systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Prometheus
          After=network.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus/ \
            --web.enable-admin-api \
            --web.config.file=/etc/prometheus/web.yml
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Restart prometheus

    - name: Enable and start prometheus
      ansible.builtin.systemd:
        name: prometheus
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted
