---
- name: Install Prometheus
  hosts: all
  become: true
  vars:
    prometheus_version: "2.51.0"

  tasks:
    - name: Create prometheus system user
      ansible.builtin.user:
        name: prometheus
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create prometheus directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Download prometheus
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
        mode: '0644'

    - name: Extract prometheus
      ansible.builtin.unarchive:
        src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
        dest: /tmp/
        remote_src: true

    - name: Install prometheus and promtool binaries
      ansible.builtin.copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        owner: root
        group: root
        mode: '0755'
        remote_src: true
      loop:
        - prometheus
        - promtool

    - name: Copy console files
      ansible.builtin.copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: /etc/prometheus/
        owner: prometheus
        group: prometheus
        remote_src: true
      loop:
        - consoles
        - console_libraries

    - name: Configure prometheus
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0640'
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'node'
              static_configs:
                - targets:
          {% for host in groups['all'] %}
                    - '{{ hostvars[host]["ansible_host"] | default(host) }}:9100'
          {% endfor %}

            - job_name: 'pihole'
              static_configs:
                - targets:
          {% for host in groups['pihole'] %}
                    - '{{ hostvars[host]["ansible_host"] | default(host) }}:9617'
          {% endfor %}

            - job_name: 'gitea'
              static_configs:
                - targets:
          {% for host in groups['gitea'] %}
                    - '{{ hostvars[host]["ansible_host"] | default(host) }}:3000'
          {% endfor %}

            - job_name: 'mariadb'
              static_configs:
                - targets:
          {% for host in groups['mariadb'] %}
                    - '{{ hostvars[host]["ansible_host"] | default(host) }}:9104'
          {% endfor %}

            - job_name: 'snmp'
              scrape_interval: 30s
              scrape_timeout: 20s
              metrics_path: /snmp
              params:
                auth: ['unifi_v3']
                module: ['if_mib']
              static_configs:
                - targets:
                    - '198.51.100.1'
                    - '198.51.100.2'
                    - '198.51.100.3'
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - source_labels: [__param_target]
                  target_label: instance
                - target_label: __address__
                  replacement: fiordland.example.com:9116

            - job_name: 'pve'
              metrics_path: /pve
              params:
                target: ['192.0.2.5']
                cluster: ['1']
                node: ['1']
              static_configs:
                - targets:
                    - 'localhost:9221'
              relabel_configs:
                - source_labels: [__param_target]
                  target_label: instance
      notify: Restart prometheus

    - name: Create prometheus systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Prometheus
          After=network.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus/ \
            --web.console.templates=/etc/prometheus/consoles \
            --web.console.libraries=/etc/prometheus/console_libraries
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Restart prometheus

    - name: Enable and start prometheus
      ansible.builtin.systemd:
        name: prometheus
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted
