---
- name: Bootstrap Vault (KV engine, ansible policy, AppRole)
  hosts: vault
  become: false
  gather_facts: false

  vars:
    vault_addr: "https://vault.example.com:8200"
    vault_ca_local: /usr/local/share/ca-certificates/example-ca.crt
    vault_ca_remote: /etc/ssl/example/ca.pem
    vault_policy_src: "{{ playbook_dir }}/files/vault/policies/ansible.hcl"

  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_CACERT: "{{ vault_ca_remote }}"
    VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"

  tasks:
    - name: Require VAULT_TOKEN in environment
      ansible.builtin.assert:
        that:
          - lookup('env', 'VAULT_TOKEN') | length > 0
        fail_msg: "Export VAULT_TOKEN=<root-token> before running this playbook."

    - name: List enabled secrets engines
      ansible.builtin.command: vault secrets list -format=json
      register: secrets_list
      changed_when: false

    - name: Enable kv-v2 at kv/
      ansible.builtin.command: vault secrets enable -version=2 -path=kv kv
      when: "'kv/' not in (secrets_list.stdout | from_json)"

    - name: Copy ansible policy to vault host
      ansible.builtin.copy:
        src: "{{ vault_policy_src }}"
        dest: /tmp/ansible-policy.hcl
        mode: '0600'

    - name: Write ansible policy
      ansible.builtin.command: vault policy write ansible /tmp/ansible-policy.hcl
      register: policy_write
      changed_when: "'Success!' in policy_write.stdout"

    - name: Remove temporary policy file
      ansible.builtin.file:
        path: /tmp/ansible-policy.hcl
        state: absent

    - name: List auth methods
      ansible.builtin.command: vault auth list -format=json
      register: auth_list
      changed_when: false

    - name: Enable approle auth method
      ansible.builtin.command: vault auth enable approle
      when: "'approle/' not in (auth_list.stdout | from_json)"

    - name: Create/update ansible AppRole
      ansible.builtin.command: >
        vault write auth/approle/role/ansible
        token_policies=ansible
        token_ttl=1h
        token_max_ttl=4h
        secret_id_ttl=0
        secret_id_num_uses=0
      changed_when: true

    - name: Fetch role_id
      ansible.builtin.command: vault read -field=role_id auth/approle/role/ansible/role-id
      register: role_id
      changed_when: false
      no_log: true

    - name: Generate secret_id
      ansible.builtin.command: vault write -field=secret_id -f auth/approle/role/ansible/secret-id
      register: secret_id
      changed_when: true
      no_log: true

    - name: Ensure /etc/vault-ansible exists on controller
      ansible.builtin.file:
        path: /etc/vault-ansible
        state: directory
        owner: admin
        group: admin
        mode: '0750'
      delegate_to: localhost
      become: true

    - name: Write AppRole env file to controller
      ansible.builtin.copy:
        dest: /etc/vault-ansible/env
        owner: admin
        group: admin
        mode: '0600'
        content: |
          # Generated by vault_bootstrap.yml — keep out of git.
          # Vault CLI variables.
          export VAULT_ADDR={{ vault_addr }}
          export VAULT_CACERT={{ vault_ca_local }}
          export VAULT_ROLE_ID={{ role_id.stdout }}
          export VAULT_SECRET_ID={{ secret_id.stdout }}
          # community.hashi_vault 7.x reads ANSIBLE_HASHI_VAULT_* env vars,
          # not the plain VAULT_* names — export both prefixes so lookups work.
          export ANSIBLE_HASHI_VAULT_ADDR={{ vault_addr }}
          export ANSIBLE_HASHI_VAULT_CA_CERT={{ vault_ca_local }}
          export ANSIBLE_HASHI_VAULT_ROLE_ID={{ role_id.stdout }}
          export ANSIBLE_HASHI_VAULT_SECRET_ID={{ secret_id.stdout }}
      delegate_to: localhost
      become: true
      no_log: true

    - name: Report success
      ansible.builtin.debug:
        msg: >-
          AppRole credentials written to /etc/vault-ansible/env on the controller.
          Source it before running playbooks: `source /etc/vault-ansible/env`.
