---
- name: Install Authentik
  hosts: all
  become: true

  vars:
    authentik_version: "2026.2"
    authentik_dir: /opt/authentik
    # Ordered list of all major releases; stepped upgrade walks through each
    authentik_releases:
      - "2024.12"
      - "2025.2"
      - "2025.4"
      - "2025.6"
      - "2025.8"
      - "2025.10"
      - "2025.12"
      - "2026.2"

  tasks:
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: "{{ ansible_distribution_release }}"
        components: stable
        signed_by: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create authentik directory
      ansible.builtin.file:
        path: "{{ authentik_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Check if TLS key exists
      ansible.builtin.stat:
        path: /etc/ssl/example/key.pem
      register: tls_key

    - name: Make TLS key readable for Docker bind mount
      ansible.builtin.file:
        path: /etc/ssl/example/key.pem
        mode: '0644'
      when: tls_key.stat.exists

    - name: Deploy docker-compose.yml
      ansible.builtin.copy:
        dest: "{{ authentik_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0640'
        content: |
          services:
            postgresql:
              image: docker.io/library/postgres:16-alpine
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
                start_period: 20s
                interval: 30s
                retries: 5
                timeout: 5s
              volumes:
                - database:/var/lib/postgresql/data
              environment:
                POSTGRES_PASSWORD: ${PG_PASS}
                POSTGRES_USER: authentik
                POSTGRES_DB: authentik

            redis:
              image: docker.io/library/redis:7-alpine
              command: --save 60 1 --loglevel warning
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
                start_period: 20s
                interval: 30s
                retries: 5
                timeout: 3s
              volumes:
                - redis:/data

            server:
              image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
              restart: unless-stopped
              command: server
              environment:
                AUTHENTIK_REDIS__HOST: redis
                AUTHENTIK_POSTGRESQL__HOST: postgresql
                AUTHENTIK_POSTGRESQL__USER: authentik
                AUTHENTIK_POSTGRESQL__NAME: authentik
                AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
                AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
              volumes:
                - media:/media
                - custom-templates:/templates
                - /etc/ssl/example:/certs:ro
              ports:
                - "9000:9000"
                - "9443:9443"
              depends_on:
                postgresql:
                  condition: service_healthy
                redis:
                  condition: service_healthy

            worker:
              image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
              restart: unless-stopped
              command: worker
              environment:
                AUTHENTIK_REDIS__HOST: redis
                AUTHENTIK_POSTGRESQL__HOST: postgresql
                AUTHENTIK_POSTGRESQL__USER: authentik
                AUTHENTIK_POSTGRESQL__NAME: authentik
                AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
                AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
              user: root
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
                - media:/media
                - custom-templates:/templates

          volumes:
            database:
              driver: local
            redis:
              driver: local
            media:
              driver: local
            custom-templates:
              driver: local

    - name: Check if .env exists
      ansible.builtin.stat:
        path: "{{ authentik_dir }}/.env"
      register: env_file

    - name: Read current AUTHENTIK_TAG from .env
      ansible.builtin.slurp:
        src: "{{ authentik_dir }}/.env"
      register: env_content
      when: env_file.stat.exists

    - name: Set current version fact
      ansible.builtin.set_fact:
        authentik_current_version: >-
          {{ (env_content.content | b64decode | regex_search('AUTHENTIK_TAG=(.+)', '\1'))[0] | default('') }}
      when: env_file.stat.exists

    - name: Set current version fact for fresh install
      ansible.builtin.set_fact:
        authentik_current_version: ""
      when: not env_file.stat.exists

    - name: Build upgrade path
      ansible.builtin.set_fact:
        authentik_upgrade_path: >-
          {{
            authentik_releases
            | select('version_compare', authentik_current_version, '>')
            | select('version_compare', authentik_version, '<=')
            | list
          }}
      when: authentik_current_version | length > 0

    - name: Set upgrade path for fresh install
      ansible.builtin.set_fact:
        authentik_upgrade_path:
          - "{{ authentik_version }}"
      when: authentik_current_version | length == 0

    - name: Step through upgrade path
      ansible.builtin.include_tasks: authentik_upgrade_step.yml
      loop: "{{ authentik_upgrade_path }}"
      loop_control:
        loop_var: step_version
