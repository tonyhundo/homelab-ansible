---
- name: Package Installations
  hosts: vms
  become: true
  tasks:
    - name: Install default pkgs
      ansible.builtin.apt:
        name:
          - htop
          - net-tools
          - qemu-guest-agent
        state: latest

    - name: Enable and start qemu-guest-agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started

- name: Set root password
  hosts: all
  become: true
  vars_files:
    - vault.yml
  tasks:
    - name: Get current root password hash
      ansible.builtin.getent:
        database: shadow
        key: root

    - name: Extract salt from current hash
      ansible.builtin.set_fact:
        root_salt: "{{ getent_shadow['root'][0].split('$')[2] }}"
      when: getent_shadow['root'][0] is match('^\$6\$')
      no_log: true

    - name: Generate expected hash with current salt
      ansible.builtin.command:
        argv:
          - openssl
          - passwd
          - -6
          - -salt
          - "{{ root_salt }}"
          - "{{ root_password }}"
      register: root_expected
      changed_when: false
      when: root_salt is defined
      no_log: true

    - name: Set root password
      ansible.builtin.command:
        argv:
          - chpasswd
          - -c
          - SHA512
        stdin: "root:{{ root_password }}"
      changed_when: root_expected is skipped or getent_shadow['root'][0] != root_expected.stdout
      no_log: true

- name: Configure users with sudo access
  hosts: all
  become: true
  gather_facts: true

  vars:
    users:
      - name: admin
        uid: 1000
        shell: /bin/bash
        groups: sudo
        sudo: ['ALL=(ALL) NOPASSWD:ALL']
        ssh_key:
          - ssh-rsa  admin@emperor

      - name: ansible                                   
        uid: 1001
        shell: /bin/bash
        groups: sudo                                         
        sudo: ['ALL=(ALL) NOPASSWD:ALL']                     
        ssh_key:                                 
          - ssh-rsa  ansible@ansible.example.com

  tasks:
    - name: Ensure sudo group exists
      ansible.builtin.group:
        name: sudo
        state: present

    - name: Create users
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: "{{ item.shell }}"
        groups: "{{ item.groups }}"
        append: true
        create_home: true
        state: present
      loop: "{{ users }}"

    - name: Create .ssh directory for each user
      ansible.builtin.file:
        path: "/home/{{ item.name }}/.ssh"
        state: directory
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: "0700"
      loop: "{{ users }}"

    - name: Add SSH authorized keys
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        key: "{{ item.ssh_key | join('\n') }}"
        state: present
      loop: "{{ users }}"

    - name: Grant passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ item.name }}"
        content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      loop: "{{ users }}"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Ensure sshd allows pubkey auth
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PubkeyAuthentication"
        line: "PubkeyAuthentication yes"
        state: present
      notify: Restart sshd

    - name: Disable password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
        state: present
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: "{{ 'sshd' if ansible_facts.services['sshd.service'] is defined else 'ssh' }}"
        state: restarted

- import_playbook: node_exporter.yml
- import_playbook: step_ca_client.yml
