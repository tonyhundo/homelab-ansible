---
- name: Install SNMP Exporter
  # Runs on emperor (192.0.2.4) — the poller that can reach the UniFi gear on
  # 198.51.100.x UDP 161. Relocated here 2026-06-21 after fiordland was retired.
  hosts: emperor
  become: true
  vars:
    snmp_exporter_version: "0.30.1"

  tasks:
    - name: Create snmp_exporter system user
      ansible.builtin.user:
        name: snmp_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create snmp_exporter config directory
      ansible.builtin.file:
        path: /etc/snmp_exporter
        state: directory
        owner: snmp_exporter
        group: snmp_exporter
        mode: '0755'

    - name: Download snmp_exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/snmp_exporter/releases/download/v{{ snmp_exporter_version }}/snmp_exporter-{{ snmp_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/snmp_exporter-{{ snmp_exporter_version }}.tar.gz"
        mode: '0644'

    - name: Extract snmp_exporter
      ansible.builtin.unarchive:
        src: "/tmp/snmp_exporter-{{ snmp_exporter_version }}.tar.gz"
        dest: /tmp/
        remote_src: true

    - name: Install snmp_exporter binary
      ansible.builtin.copy:
        src: "/tmp/snmp_exporter-{{ snmp_exporter_version }}.linux-amd64/snmp_exporter"
        dest: /usr/local/bin/snmp_exporter
        owner: root
        group: root
        mode: '0755'
        remote_src: true
      notify: Restart snmp_exporter

    - name: Copy bundled snmp.yml config
      ansible.builtin.copy:
        src: "/tmp/snmp_exporter-{{ snmp_exporter_version }}.linux-amd64/snmp.yml"
        dest: /etc/snmp_exporter/snmp.yml
        owner: snmp_exporter
        group: snmp_exporter
        mode: '0600'
        remote_src: true
      notify: Restart snmp_exporter

    - name: Add SNMPv3 auth to config
      no_log: true
      ansible.builtin.blockinfile:
        path: /etc/snmp_exporter/snmp.yml
        insertafter: "^auths:"
        marker: "# {mark} ANSIBLE MANAGED - unifi_v3 auth"
        block: |2
            unifi_v3:
              version: 3
              security_level: authPriv
              username: tonyhundo
              password: {{ snmp_v3_password }}
              auth_protocol: SHA
              priv_protocol: AES
              priv_password: {{ snmp_v3_password }}
      notify: Restart snmp_exporter

    - name: Create snmp_exporter systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/snmp_exporter.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=SNMP Exporter
          After=network.target

          [Service]
          User=snmp_exporter
          Group=snmp_exporter
          Type=simple
          ExecStart=/usr/local/bin/snmp_exporter --config.file=/etc/snmp_exporter/snmp.yml
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Restart snmp_exporter

    - name: Enable and start snmp_exporter
      ansible.builtin.systemd:
        name: snmp_exporter
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart snmp_exporter
      ansible.builtin.systemd:
        name: snmp_exporter
        state: restarted
