---
- name: Install Splunk Enterprise
  hosts: all
  become: true
  vars:
    splunk_deb: splunk-10.2.2-80b90d638de6-linux-amd64.deb
    splunk_home: /opt/splunk
    splunk_admin_password: ***REMOVED-SPLUNK-ADMIN-PW***

  tasks:
    - name: Copy Splunk deb package to host
      become: false
      ansible.builtin.copy:
        src: "../pkgs/{{ splunk_deb }}"
        dest: "/tmp/{{ splunk_deb }}"
        mode: '0644'

    - name: Install Splunk deb package
      ansible.builtin.apt:
        deb: "/tmp/{{ splunk_deb }}"
        state: present

    - name: Set ownership of Splunk directory
      ansible.builtin.file:
        path: "{{ splunk_home }}"
        owner: splunk
        group: splunk
        recurse: true

    - name: Accept license and set admin password on first start
      ansible.builtin.shell:
        cmd: "sudo -u splunk {{ splunk_home }}/bin/splunk start --accept-license --answer-yes --no-prompt --seed-passwd {{ splunk_admin_password }}"
        creates: "{{ splunk_home }}/var/lib/splunk/kvstore"

    - name: Stop Splunk before enabling boot-start
      ansible.builtin.shell:
        cmd: "sudo -u splunk {{ splunk_home }}/bin/splunk stop"
      changed_when: true

    - name: Enable Splunk to start at boot
      ansible.builtin.command:
        cmd: "{{ splunk_home }}/bin/splunk enable boot-start -user splunk --accept-license --answer-yes --no-prompt"
        creates: /etc/systemd/system/splunk.service

    - name: Ensure Splunk is running
      ansible.builtin.systemd:
        name: splunk
        enabled: true
        state: started
        daemon_reload: true

    - name: Add splunk user to ssl-cert group
      ansible.builtin.user:
        name: splunk
        groups: ssl-cert
        append: true

    - name: Configure Splunk web TLS
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/etc/system/local/web.conf"
        owner: splunk
        group: splunk
        mode: '0600'
        content: |
          [settings]
          enableSplunkWebSSL = true
          privKeyPath = /etc/ssl/example/key.pem
          serverCert = /etc/ssl/example/cert.pem
      notify: Restart splunk

    - name: Clean up deb package
      ansible.builtin.file:
        path: "/tmp/{{ splunk_deb }}"
        state: absent

  handlers:
    - name: Restart splunk
      ansible.builtin.systemd:
        name: splunk
        state: restarted
